spring:
  datasource:
    # 使用TNS别名连接字符串，支持故障转移
    url: jdbc:oracle:thin:@ORCL
    username: ODBA
    password: 5208
    # 连接池配置优化
    hikari:
      # OLTP系统连接池设置
      maximum-pool-size: 20
      minimum-idle: 5
      # 减少连接获取超时，加速故障识别
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      # 更快发现泄漏连接
      leak-detection-threshold: 30000
      # 连接验证策略
      connection-test-query: SELECT 1 FROM DUAL
      validation-timeout: 3000
      # 数据源属性
      data-source-properties:
        # 时区和特性设置
        "[oracle.jdbc.timezoneAsRegion]": false
        # 优化的Oracle故障转移和重试属性
        "[oracle.net.CONNECT_TIMEOUT]": 5000
        "[oracle.jdbc.ReadTimeout]": 15000
        "[oracle.net.READ_TIMEOUT]": 15000
        "[oracle.jdbc.autoCommitSpecCompliant]": false
        # 启用快速连接故障转移
        "[oracle.jdbc.FastConnectionFailoverEnabled]": true
        # 配置错误重试次数
        "[oracle.jdbc.maxOperationAttempts]": 5
        # TAF配置
        "[oracle.jdbc.implicitStatementCacheSize]": 30
        "[oracle.jdbc.defaultRowPrefetch]": 20
