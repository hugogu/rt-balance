apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: {{ .Values.accountService.replicas }}
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - account-service
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: account-service
          image: {{ .Values.accountService.image }}
          ports:
            - containerPort: 8080
            - containerPort: 9010
          # QoS should be set to Guaranteed to ensure that the pod has the resources it requests.
          # And it is also a performance benchmark baseline.
          # The resource setting is verified to be stable in k8s environment.
          # Trying to reduce the resource allocation may cause unstable performance.
          resources:
            requests:
              memory: "2048Mi"
              cpu: "1024m"
            limits:
              memory: "2048Mi"
              cpu: "1024m"
          env:
            {{- if .Values.accountService.env }}
            {{- range .Values.accountService.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          livenessProbe: {{ toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe: {{ toYaml .Values.probes.readiness | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  selector:
    app: account-service
  ports:
    - name: service-port
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: debug-port
      protocol: TCP
      port: 9010
      targetPort: 9010

{{- if .Values.accountService.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: account-service
  minReplicas: {{ .Values.accountService.hpa.minReplicas }}
  maxReplicas: {{ .Values.accountService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.accountService.hpa.targetCPUUtilizationPercentage }}
{{- end }}

