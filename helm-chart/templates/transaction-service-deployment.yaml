apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
spec:
  replicas: {{ .Values.transactionService.replicas }}
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - transaction-service
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: transaction-service
          image: {{ .Values.transactionService.image }}
          ports:
            - containerPort: 8080
          env:
            {{- if .Values.transactionService.env }}
            {{- range .Values.transactionService.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          livenessProbe: {{ toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe: {{ toYaml .Values.probes.readiness | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
spec:
  selector:
    app: transaction-service
  ports:
    - name: service-port
      protocol: TCP
      port: 8080
      targetPort: 8080

{{- if .Values.transactionService.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: {{ .Values.transactionService.hpa.minReplicas }}
  maxReplicas: {{ .Values.transactionService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.transactionService.hpa.targetCPUUtilizationPercentage }}
{{- end }}
