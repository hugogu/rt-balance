apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ssh-tunnel
  labels:
    app: {{ .Release.Name }}-ssh-tunnel
spec:
  type: NodePort
  ports:
    - port: 2222
      targetPort: 2222
      name: ssh
      nodePort: 30022
    - port: 20880
      targetPort: 20880
      name: dubbo-proxy
      nodePort: 30080
  selector:
    app: {{ .Release.Name }}-ssh-tunnel 